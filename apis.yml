  that used utility meter and building data to profile commercial and industrial customers,
  helping utilities target energy-efficiency and customer-engagement programs. The company
  was acquired by Uplight, and the firstfuel.com domain now redirects to uplight.com.
  It was surfaced as a portfolio company of Battery Ventures and added to the API Evangelist
